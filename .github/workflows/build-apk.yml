name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Run Android Lint
        run: ./gradlew lint --stacktrace --no-daemon

      - name: Package APKs
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} output-apks/ \;
          ls -la output-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-APKs
          path: output-apks/*.apk
          if-no-files-found: error

      - name: Upload Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lint-Report
          path: app/build/reports/lint-results*
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          tag_name: v1.2.1
          name: "Gallery v1.2.1 (Hotfix: Startup Crash on Android KeyStore Caller-Provided IV)"
          body: |
            ## Gallery Android Application v1.2.1 - Hotfix Release

            ### Hotfix:
            - **Fixed App Startup Crash (`InvalidAlgorithmParameterException: Caller-provided IV not permitted`)**:
              Android KeyStore enforces randomized encryption by default and strictly rejects caller-provided IVs in `ENCRYPT_MODE`.
              Fixed `VaultCryptoManager.ensureMasterKeyInitialized` to let the system generate a secure random 12-byte IV via `cipher.init(Cipher.ENCRYPT_MODE, kek)` and retrieve it via `cipher.iv`. Added fallback handling and atomic file writes.

            ### Phase 3 & 4 Features:
            - **No False 'Hidden' Success**: Verified copy checksum before requesting Scoped Storage deletion consent; never leaves originals silently visible.
            - **Duplicate Row Race Fix**: Single insert path with -1 error detection and full metadata preservation (dateTaken, folder, original name).
            - **Video & Photo Restore**: Correct collection selection (Images vs Video), original relative path preservation, IS_PENDING handling, and MediaStore rollback on failure.
            - **Non-Destructive Room Migrations**: Explicit non-destructive migrations (1->2 unique index, 2->3 encryption metadata) with exported schemas.
            - **Reliable Deletion Result**: Returns Success only when rows > 0 or dialog confirmed; handles cancellation and partial failures.
            - **Real Library & Permissions**: Removed fake Unsplash demo photos and stripped INTERNET permission; added permission denied and partial access UI states.
            - **Live Media Updates**: MediaStore ContentObserver with 500ms debounce and lifecycle ON_RESUME refresh.
            - **Hierarchical Back Navigation**: Back returns from child tabs to Photos first; leaving vault locks it; predictive back supported.
            - **Performance & ExoPlayer**: Optimized LazyVerticalGrid with stable keys, contentType, downscaled thumbnails, and ExoPlayer release on swipe.
            - **PillNavigationBar**: Floating capsule navigation bar with Bento styling, elevation, and talkback Role.Tab semantics.
            - **Bottom Content Padding**: 96.dp bottom padding for grid items, ensuring zero content overlap across 3-button/gesture nav and font scale 1.3+.
            - **Debug-Only Logging**: Secure GalleryLog wrapper stripping all logging in release builds.

            ### Phase 4 Floating Pill Navigation:
            - **PillNavigationBar**: Floating capsule navigation bar with Bento styling, elevation, and talkback Role.Tab semantics.
            - Bottom content padding ensuring floating pill never covers the last row of photos.
            - Fully responsive for gesture navigation, 3-button navigation, small & large screens, and font scale 1.3.

            ### Included artifacts:
            - Debug APK
            - Release APK (R8 minified & resource shrunk)
          generate_release_notes: false
