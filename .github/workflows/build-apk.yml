name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Run Android Lint
        run: ./gradlew lint --stacktrace --no-daemon

      - name: Package APKs
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} output-apks/ \;
          ls -la output-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-APKs
          path: output-apks/*.apk
          if-no-files-found: error

      - name: Upload Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lint-Report
          path: app/build/reports/lint-results*
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          tag_name: v1.3.0
          name: "Gallery v1.3.0 (Floating Pill Navigation, New Icon & Repository Structure)"
          body: |
            ## Gallery Android Application v1.3.0 Release

            ### New in v1.3.0:
            - **Custom App Icon Integration**: Applied high-resolution adaptive app icon from `Icon2` repository across all mipmap densities (hdpi, mdpi, xhdpi, xxhdpi, xxxhdpi) including monochrome and adaptive layers.
            - **True Transparent Floating Navigation**: Removed black background behind `PillNavigationBar`, letting photos scroll seamlessly underneath the floating capsule.
            - **Floating Pill Action Bar in Image Viewer**: Converted the square bottom toolbar in `ImageViewerScreen` into an elevated floating pill capsule with glassmorphic styling, matching the main navigation bar.
            - **Bottom Padding Refinements**: Added 110.dp bottom content padding across all screens (Albums, Settings, Vault, Timeline) so the last item is never hidden behind the floating pill.
            - **Repository Architecture Guide**: Comprehensive `README.md` added explaining package architecture, security, and contribution guides.

            ### Previous Security & Hardening Features:
            - **Fixed App Startup Crash**: Android KeyStore randomized IV handling in `VaultCryptoManager`.
            - **VaultCore Streaming AEAD**: Seekable `AesGcmHkdfStreaming` encryption at rest with StrongBox KeyStore wrapping.
            - **Scoped Storage Deletion Consent**: IntentSender confirmation handling.
            - **Explicit Room Migrations**: Non-destructive migrations (1->2, 2->3).
            - **Live Media Updates**: Debounced ContentObserver and lifecycle refresh.
            - **Zero Internet Permission**: 100% offline security.
            - **PillNavigationBar**: Floating capsule navigation bar with Bento styling, elevation, and talkback Role.Tab semantics.
            - Bottom content padding ensuring floating pill never covers the last row of photos.
            - Fully responsive for gesture navigation, 3-button navigation, small & large screens, and font scale 1.3.

            ### Included artifacts:
            - Debug APK
            - Release APK (R8 minified & resource shrunk)
          generate_release_notes: false
