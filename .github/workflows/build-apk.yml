name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Run Android Lint
        run: ./gradlew lint --stacktrace --no-daemon

      - name: Package APKs
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} output-apks/ \;
          ls -la output-apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-APKs
          path: output-apks/*.apk
          if-no-files-found: error

      - name: Upload Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lint-Report
          path: app/build/reports/lint-results*
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          tag_name: v1.1.0
          name: "Gallery v1.1.0 (Phase 2: VaultCore Hardware Security & Tink AEAD)"
          body: |
            ## Gallery Android Application v1.1.0 - Phase 2 Security Hardening

            Key security enhancements:
            - **Tink Streaming AEAD**: AES-256-GCM HKDF streaming encryption with random-access seek support for large media.
            - **Android Keystore Wrapping**: Master key protected by hardware-backed Keystore with StrongBox support.
            - **PIN Hardening**: PBKDF2-HMAC-SHA256 with 100,000 iterations, hardware Keystore HMAC binding, and exponential backoff lockout.
            - **Biometric CryptoObject**: Biometric authentication cryptographically releases vault keys.
            - **In-Memory Decryption**: Zero plaintext written to disk/cache; master key zeroed on session lock.
            - **Auto-Lock & FLAG_SECURE**: Automatic background locking and dynamic screenshot/recents protection.
            - **Backup Protection**: All cloud/local Android backups completely disabled.
            - **Unit Tests Verified**: 100% passing crypto round-trip, seekable decryption, and lockout tests.

            Included artifacts:
            - Debug APK
            - Release APK (R8 minified & resource shrunk)
          generate_release_notes: false
